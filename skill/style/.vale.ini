# The rule set behind `cold-read style`. Vale reads this file; the rules it
# names come from two places:
#
#   styles/cold-read/   our own rules, kept in this repo
#   styles/ai-tells*/   tbhb/vale-ai-tells (MIT), fetched by `vale sync` at the
#                       version pinned below and not committed
#
# Only the rules listed here run. Each one was helpful in at least half of a
# random sample of its hits on agent-written markdown; AGENTS.md says how a
# rule gets added.
StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-experimental.zip

[*.md]
cold-read.Dash = YES

# A plain verb swapped for a figure of speech.
ai-tells.FigurativeLives = YES
ai-tells.FigurativeShape = YES
ai-tells.FigurativeEarns = YES
ai-tells.FigurativeSurfaces = YES
ai-tells.FigurativeTravels = YES
ai-tells.FigurativeDisguises = YES
ai-tells.FigurativeMints = YES
ai-tells.FigurativeSweeps = YES
ai-tells.FigurativeClears = YES
ai-tells.FigurativeRides = YES
ai-tells.FigurativeCasts = YES
ai-tells.EnforcementMetaphors = YES
ai-tells.AnthropomorphicJustification = YES

# Staging a point instead of stating it.
ai-tells.EmphaticCopula = YES
ai-tells.PseudoCleft = YES
ai-tells.ShellNounCopula = YES
ai-tells.PointVerdict = YES
ai-tells.SummativeAppositive = YES

# Writing about the document instead of its subject.
ai-tells.Metacommentary = YES
ai-tells.StructureAnnouncements = YES
ai-tells.AnnouncementHeadings = YES

# Stock AI words.
ai-tells-experimental.VocabularySwap = YES
